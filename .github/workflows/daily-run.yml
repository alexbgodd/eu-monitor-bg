name: Daily scrape (no emails)

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC всеки ден (не кръгъл час — избягва GH пикови забавяния)
  workflow_dispatch: {}    # ръчно пускане от Actions таба

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape programs
        run: python scraper/scraper.py

      - name: Scrape EU news
        run: python scraper/scrape_eu_news.py

      - name: Regenerate SEO pages
        run: python scraper/generate_seo_pages.py

      - name: Commit updated data (ако има промяна)
        run: |
          git config user.name "eu-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/programs.json data/eu-news.json web/institucii/
          git diff --staged --quiet || git commit -m "chore: automated scrape update $(date -u +%Y-%m-%d)"
          # Ако междувременно е push-нато локално, push-ът тук се отхвърля →
          # rebase преди push (инцидент 18.08.2026).
          git pull --rebase --autostash origin master
          git push

      # Supabase free tier паузира проекта след ~седмица без заявки.
      # Седмичният blast сам по себе си е на ръба → дневен пинг го държи буден.
      # Стъпката е последна и пада червено, ако базата не отговаря (видим сигнал).
      - name: Keep-alive пинг към Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          # Без select= → не зависи от имена на колони (select=id даваше 400).
          # -o /dev/null изхвърля тялото, за да не изтекат имейли в публичния лог.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            "$SUPABASE_URL/rest/v1/registrations?limit=1")
          echo "Supabase HTTP $code"
          test "$code" = "200"
