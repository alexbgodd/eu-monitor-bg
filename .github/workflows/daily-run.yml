name: Daily scrape (no emails)

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC всеки ден (не кръгъл час — избягва GH пикови забавяния)
  workflow_dispatch: {}    # ръчно пускане от Actions таба

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape programs
        run: python scraper/scraper.py

      - name: Scrape EU news
        run: python scraper/scrape_eu_news.py

      - name: Regenerate SEO pages
        run: python scraper/generate_seo_pages.py

      - name: Commit updated data (ако има промяна)
        run: |
          git config user.name "eu-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/programs.json data/eu-news.json web/institucii/
          git diff --staged --quiet || git commit -m "chore: automated scrape update $(date -u +%Y-%m-%d)"
          git push
