name: Supabase keep-alive

# Отделен от daily-run.yml нарочно: ако скрейпът падне, стъпките след него
# се пропускат и пингът не стига до базата. Тук няма нищо друго, което да го спре.
on:
  schedule:
    - cron: '43 11 * * *'   # 11:43 UTC всеки ден (различно време от скрейпа)
  workflow_dispatch: {}     # ръчно пускане от Actions таба

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Заявка към базата (с преброяване)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          # Prefer: count=exact кара базата да изпълни реално COUNT(*),
          # а не само да върне кеширан отговор.
          # -o /dev/null изхвърля тялото: в публичния лог не излиза нищо за абонатите.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: $SUPABASE_SECRET_KEY" \
              -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
              -H "Prefer: count=exact" \
              "$SUPABASE_URL/rest/v1/registrations?limit=1")
            echo "Опит $attempt: Supabase HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then exit 0; fi
            sleep 20
          done
          echo "Базата не отговаря. Провери дали проектът не е паузиран: Supabase → Resume project."
          exit 1
