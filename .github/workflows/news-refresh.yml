name: News refresh (noon)

on:
  schedule:
    - cron: '27 9 * * *'   # 09:27 UTC ≈ 12:27 българско време (лятно; зимно ~11:27)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape EU news
        run: python scraper/scrape_eu_news.py

      - name: Commit updated news (ако има промяна)
        run: |
          git config user.name "eu-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/eu-news.json
          git diff --staged --quiet || git commit -m "chore: noon news refresh $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin master
          git push
